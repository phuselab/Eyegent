[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyegent"
version = "0.1.0"
description = "The Eyegent active vision agent with CLIPSeg and ScanDDM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=4.57,<6",
  "openai>=1,<3",
  "PyYAML>=6,<7",
  "opencv-python-headless>=4.10,<5",
  "pycocotools>=2.0.7,<3",
]

[project.scripts]
eyegent = "eyegent.cli:main"

[tool.setuptools.packages.find]
include = ["eyegent*"]

[tool.setuptools.package-data]
eyegent = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]
